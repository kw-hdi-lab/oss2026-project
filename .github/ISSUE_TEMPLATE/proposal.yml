name: 프로젝트 제안
description: 팀 프로젝트 주제를 제안합니다. 팀당 하나만 올립니다.
title: "[teamNN] "
labels: ["제안"]
body:
  - type: markdown
    attributes:
      value: |
        제목의 `NN` 을 두 자리 팀 번호로 바꾸고 주제 이름을 적습니다. 예: `[team03] 동아리 MT 장소 정하기`
        이름과 학번은 적지 않습니다. 담당은 GitHub 아이디로 적습니다.
        각 칸에 무엇을 적을지는 [README](https://github.com/kw-hdi-lab/oss2026-project#readme) 의 1~4장을 참고합니다.
        팀당 이슈 하나만 올립니다. 내용을 고칠 때는 새 이슈를 열지 않고 이 이슈의 본문을 고치거나 댓글로 적습니다.
  - type: input
    id: summary
    attributes:
      label: 한 줄 소개
      placeholder: 동아리 회원이 MT 후보 장소를 조건으로 거르고 투표로 정하는 웹 앱
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: 누가, 언제, 무엇 때문에 불편한가
      description: 대상을 구체적으로 적습니다. 실제로 물어본 사람이 있으면 들은 내용을 한 줄씩 적습니다.
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: 지금은 어떻게 해결하고 있나
      description: 지금 쓰는 방법과, 그 방법으로 부족한 점을 적습니다.
    validations:
      required: true
  - type: textarea
    id: chatgpt
    attributes:
      label: ChatGPT에게 직접 묻는 것과 무엇이 다른가
      description: README 1장의 다섯 가지(데이터가 쌓임, 여러 사람이 함께 씀, 실시간 외부 데이터, 같은 입력에 같은 결과, 화면이 더 빠름) 중 무엇에 해당하는지 적습니다.
    validations:
      required: true
  - type: textarea
    id: first
    attributes:
      label: 가장 먼저 완성할 기능
      description: 사용자가 화면에서 무엇을 입력하고, 어떤 결과를 보는지 적습니다.
    validations:
      required: true
  - type: textarea
    id: rules
    attributes:
      label: 계산 규칙 후보 (3개 이상)
      description: 화면 없이도 "이 입력이면 이 결과"를 확인할 수 있는 규칙입니다.
      value: |
        -
        -
        -
    validations:
      required: true
  - type: textarea
    id: server
    attributes:
      label: 서버가 맡을 일
      description: 저장할 데이터, 호출할 외부 API와 키가 필요한지를 적습니다.
    validations:
      required: true
  - type: textarea
    id: llm
    attributes:
      label: 서버가 LLM을 호출하는 곳
      description: LLM에 무엇을 보내고, 받은 답을 어디에 쓰는지 적습니다.
    validations:
      required: true
  - type: dropdown
    id: frontend
    attributes:
      label: 프론트엔드
      options:
        - HTML/CSS/JavaScript
        - Vite로 만드는 프레임워크 (아래에 이름을 적습니다)
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: 프레임워크 이름 (프레임워크를 쓰는 경우만)
      description: 팀원 모두가 이미 다룰 수 있는 경우에만 씁니다.
  - type: textarea
    id: roles
    attributes:
      label: 담당
      description: 팀원마다 맡을 화면, 계산 규칙, 서버 API를 적습니다.
      value: |
        - @아이디:
        - @아이디:
        - @아이디:
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### LLM 검토
        위 칸을 다 채운 뒤, LLM(ChatGPT, Gemini, Claude 등)에게 제안을 검토받습니다. 이 항목은 LLM을 쓰는 것이 과제입니다.
        아래 프롬프트를 그대로 쓰고, 그 뒤에 README 2~4장과 이 양식에 쓴 내용을 붙여 넣습니다.

        ```
        아래는 대학 수업 팀 프로젝트 제안과 그 조건이다.
        조건에 비추어 이 제안의 가장 약한 부분 두 가지를 지적해라.
        특히 이 앱이 하는 일을 ChatGPT 같은 대화형 AI만으로 대신할 수 있는지 판단하고,
        대신할 수 있다면 어떻게 대신하는지 구체적으로 보여 줘라. 칭찬은 하지 마라.
        ```
  - type: input
    id: llm-tool
    attributes:
      label: 검토에 사용한 LLM
      placeholder: 예) ChatGPT
    validations:
      required: true
  - type: textarea
    id: llm-critique
    attributes:
      label: LLM이 지적한 점 (1~2개)
      description: 지적 내용을 요약해 적습니다.
    validations:
      required: true
  - type: textarea
    id: llm-response
    attributes:
      label: 그래서 바꾼 것, 또는 바꾸지 않은 이유
      description: 지적마다 무엇을 바꿨는지, 바꾸지 않았다면 왜인지 적습니다.
    validations:
      required: true
  - type: checkboxes
    id: check
    attributes:
      label: 확인
      options:
        - label: README 2장의 조건과 4장의 제한 사항을 확인했습니다.
          required: true
